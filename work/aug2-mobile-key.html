<div id="aug2-mobile-key">
  <style>
    #aug2-mobile-key{font-family:system-ui,"Segoe UI",sans-serif;color:#f2f4f7}#aug2-mobile-key .shell{display:grid;justify-content:center;padding:20px;background:radial-gradient(#52615966 1px,transparent 1px);background-size:12px 12px}#aug2-mobile-key .phone{width:320px;height:640px;overflow:hidden;border:8px solid #0b0d10;border-radius:32px;background:#162c25;box-shadow:0 14px 30px #0006}#aug2-mobile-key .bar{height:30px;padding:8px 13px;background:#162c25;color:#e2efe5;font-size:10px;font-weight:700;letter-spacing:.12em}#aug2-mobile-key .map{position:relative;height:336px;background:linear-gradient(145deg,#426049 0 27%,#283c32 28% 49%,#364f3f 50% 72%,#203b34 73%);overflow:hidden}#aug2-mobile-key .map:before{content:"";position:absolute;inset:-20px;background:repeating-linear-gradient(150deg,transparent 0 24px,#bdc99e30 25px 27px,transparent 28px 56px),repeating-linear-gradient(35deg,transparent 0 42px,#10282466 43px 45px,transparent 46px 78px)}#aug2-mobile-key .search{position:absolute;top:14px;left:14px;right:70px;padding:10px 12px;border:1px solid #93a397;border-radius:12px;background:#15231ff2;font-size:12px}#aug2-mobile-key .shape{position:absolute;left:76px;top:120px;width:167px;height:105px;border:4px solid #ff453a;border-radius:48% 45% 58% 43%;transform:rotate(-13deg);box-shadow:0 0 0 3px #0b0d10}#aug2-mobile-key .forecast-ring{position:absolute;left:58px;top:101px;width:205px;height:142px;border:3px double #d06bef;border-radius:51% 45% 58% 46%;transform:rotate(-12deg);background:repeating-linear-gradient(135deg,#d06bef35 0 5px,transparent 5px 10px)}#aug2-mobile-key button{font:600 13px system-ui;color:#fff;cursor:pointer}#aug2-mobile-key .key{position:absolute;bottom:14px;left:14px;min-height:38px;padding:0 13px;border:1px solid #93a397;border-radius:7px;background:#21332cf2}#aug2-mobile-key .layers{position:absolute;bottom:60px;left:14px;width:230px;padding:8px;background:#15231ff5;border:1px solid #45564d;border-radius:8px;font-size:12px}.layers div{padding:6px 2px}.layers i{display:inline-block;width:18px;height:7px;margin-right:7px;border-radius:2px;background:#ff453a}.layers .future{background:repeating-linear-gradient(135deg,#d06bef 0 3px,#9464ff 3px 6px)}.layers .advance{height:auto;background:none;color:#fff}#aug2-mobile-key .sheet{min-height:266px;padding:15px 16px;background:#15231f;border-top:3px solid #98ab94}#aug2-mobile-key h2{margin:0 0 4px;font-size:20px}#aug2-mobile-key .muted{margin:0;color:#b4bec9;font-size:12px}#aug2-mobile-key .row{margin-top:13px;padding-top:10px;border-top:1px solid #45564d;font-size:13px}#aug2-mobile-key .small-key{display:inline-flex;align-items:center;gap:7px;min-height:32px;margin-bottom:11px;padding:0 10px;border:1px solid #6b7686;border-radius:6px;background:#21332c}.small-key span{width:24px;height:7px;border-radius:2px;background:repeating-linear-gradient(135deg,#d06bef 0 3px,#9464ff 3px 6px)}#aug2-mobile-key .forecast{margin-top:12px;padding:10px;border-left:3px solid #d06bef;background:#271e2d;font-size:13px}#aug2-mobile-key .forecast small{display:block;margin-top:4px;color:#eea3ff;font-size:11px}#aug2-mobile-key .chooser{display:flex;justify-content:center;gap:8px;margin-top:12px}#aug2-mobile-key .chooser button{min-height:36px;padding:0 11px;border:1px solid #58675e;border-radius:7px;background:#21332c}#aug2-mobile-key .chooser button[aria-pressed="true"]{background:#e2efe5;color:#15231f;border-color:#e2efe5}
  </style>
  <div class="shell">
    <section class="phone" aria-label="Ignopticon Ops phone preview">
      <div class="bar">IGNOPTICON / OPS · AUG 2, 12:00</div>
      <div class="map"><span class="search" id="preview-nav">Search fire name or location</span><span class="forecast-ring" id="preview-forecast" aria-hidden="true" hidden></span><span class="shape" aria-hidden="true"></span><button class="key" id="preview-key" type="button" aria-expanded="false">Key</button><div class="layers" id="preview-layers" hidden><div><i></i>Current perimeter</div><div><i class="future"></i>Forecast +6 / +12 / +24 h</div><div><i class="advance">➜</i>Largest predicted advances</div></div></div>
      <div class="sheet" id="preview-sheet"><h2>Wildfires</h2><p class="muted">Choose a fire to see its forecast.</p><div class="row"><strong>Widemouth 2</strong><br>Millard Co., UT · 73,138 acres · Forecast</div></div>
    </section>
    <div class="chooser" aria-label="Preview state"><button id="list-state" type="button" aria-pressed="true">Fire list</button><button id="fire-state" type="button" aria-pressed="false">Selected fire</button></div>
  </div>
  <script>
    const root=document.getElementById('aug2-mobile-key');const list=root.querySelector('#list-state');const fire=root.querySelector('#fire-state');const sheet=root.querySelector('#preview-sheet');const nav=root.querySelector('#preview-nav');const key=root.querySelector('#preview-key');const layers=root.querySelector('#preview-layers');const forecast=root.querySelector('#preview-forecast');
    function render(selected){list.setAttribute('aria-pressed',!selected);fire.setAttribute('aria-pressed',selected);key.hidden=selected;key.textContent='Key';key.setAttribute('aria-expanded','false');layers.hidden=true;forecast.hidden=!selected;if(selected){nav.textContent='⌂ Home   ← Back';sheet.innerHTML='<button class="small-key" type="button"><span></span>Key</button><h2>Widemouth 2</h2><p class="muted">Millard Co., UT · 73,138 acres</p><div class="forecast"><strong>Spread forecast</strong><small>ELMFIRE · issued Aug 2, 12:00 · +6 / +12 / +24 h</small></div>';}else{nav.textContent='Search fire name or location';sheet.innerHTML='<h2>Wildfires</h2><p class="muted">Choose a fire to see its forecast.</p><div class="row"><strong>Widemouth 2</strong><br>Millard Co., UT · 73,138 acres · Forecast</div>';}}
    list.onclick=()=>render(false);fire.onclick=()=>render(true);key.onclick=()=>{layers.hidden=!layers.hidden;key.setAttribute('aria-expanded',String(!layers.hidden));};render(false);
  </script>
</div>
