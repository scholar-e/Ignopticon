<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ignopticon Ops: fires and spread forecasts</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#162c25">
<link rel="preload" href="vendor/maplibre-gl.js" as="script">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="ops.css">
<script type="module" src="ops.js"></script>
<script src="vendor/maplibre-gl.js" defer></script>
</head>
<body>
<div class="fresh"><span>IGNOPTICON / OPS</span><span id="fresh">Updated every 12 hours</span></div>
<div class="sidebar">
  <header class="brand">
    <h1>Wildfires</h1>
  </header>
  <section id="detail" class="detail" aria-labelledby="detail-name" hidden></section>
  <nav class="fires" aria-label="Fires">
    
    <div class="order">
      <span><label for="date">Select date</label>
      <select id="date"><option value="now">Today</option></select></span>
</div><p id="count" class="count"></p>
    <ul id="list" class="list"></ul>
  </nav>
<section class="conditions"><h3>Incident conditions</h3><dl><div><dt>Mapped fuel type</dt><dd id="fuel"></dd></div><div><dt>Wind at 10 m</dt><dd id="wind"></dd></div><div><dt>Weather</dt><dd id="weather"></dd></div></dl><p id="wx-source"></p></section>
<section class="fieldnotes"><h3>Incident access route</h3><p id="route-note"></p><button type="button" id="pick-access" aria-pressed="false">Choose access point on map</button><p id="access-note"></p><button type="button" id="fit-route" hidden>Show full route</button> <a id="road-directions" hidden target="_blank" rel="noopener noreferrer">Directions to route start ↗</a>
<label class="upload">Load dispatch route<input id="route-file" type="file" accept=".geojson,.json,application/geo+json,application/json"></label><p id="saved" role="status"></p><a href="storage.html">Offline maps</a></section>
<section class="layerctl" aria-label="Wind and prediction model">
      <div class="ctlrow"><label for="wind-level">Wind</label>
        <select id="wind-level">
          <option value="off">Off</option>
          <option value="surface">Surface (10 m)</option>
          <option value="1000">1000 hPa · ~100 m</option>
          <option value="850">850 hPa · ~1.5 km</option>
          <option value="700">700 hPa · ~3 km</option>
          <option value="500">500 hPa · ~5.5 km</option>
          <option value="250">250 hPa · ~10 km</option>
          <option value="70">70 hPa · ~18 km</option>
          <option value="10">10 hPa · ~26 km</option>
        </select><small id="wind-note"></small></div>
      <div class="ctlrow"><label for="activity-arm">Model</label>
        <select id="activity-arm">
          <option value="viirs-only">VIIRS only (2012–19)</option>
          <option value="harm-all">Harmonized MODIS + VIIRS</option>
          <option value="raw-all">Raw MODIS + VIIRS</option>
          <option value="harm-pre">Harmonized MODIS (2003–11)</option>
          <option value="raw-pre">Raw MODIS (2003–11)</option>
        </select><small id="activity-note"></small></div>
</section>
</div>
<main class="mapwrap" aria-label="Map">
  <div id="map" class="map"></div><div class="controls">
      <label for="filter" class="sr-only">Filter fires</label>
      <input id="filter" type="search" placeholder="Search fire name or location" autocomplete="off" spellcheck="false">
    </div><div class="mapnav"><button id="home">⌂ Home</button><button id="return">← Back</button></div><button type="button" id="locate" aria-label="Center the map on my location" title="My location"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg></button><button type="button" id="labels" class="labelsbtn" aria-pressed="true" title="State, city and river names">Labels</button><div id="viewtoggle" class="viewtoggle" role="group" aria-label="Map view"><button type="button" data-view="2d" aria-pressed="true">2D</button><button type="button" data-view="3d" aria-pressed="false" title="3D terrain (key 3)">3D</button></div>
  
  
  <div class="bottom">
  <details class="keybox onmap" id="keybox"><summary>Key</summary>
  <section class="legend open" id="legend" aria-labelledby="legend-h">
    <h2 id="legend-h" class="sr-only">Map layers</h2>
    <ul id="legend-list">
      <li><button type="button" aria-pressed="true" data-layer="current"><span class="sw sw-cur"></span><span class="s">Perimeter</span><span class="l">Current perimeter (FEDS)</span></button></li>
      <li><button type="button" aria-pressed="true" data-layer="previous"><span class="sw sw-prev"></span><span class="s">Past</span><span class="l">Past perimeters (brown to yellow)</span></button></li>
      <li><button type="button" aria-pressed="true" data-layer="forecast"><span class="sw-fc"><span class="sw sw-b0"></span><span class="sw sw-b1"></span><span class="sw sw-b2"></span></span><span class="s">Forecast</span><span class="l" id="fc-legend">Predicted front growth +6 / +12 / +24 h (hatched)</span></button></li>
      <li><button type="button" aria-pressed="true" data-layer="arrows"><span class="sw sw-arrow" aria-hidden="true">➜</span><span class="s">Advances</span><span class="l">Largest predicted advances</span></button></li>
      <li><button type="button" aria-pressed="false" data-layer="interior"><span class="sw sw-faint"></span><span class="s">Burnout</span><span class="l">Burnout inside perimeter (predicted)</span></button></li>
      <li><button type="button" aria-pressed="false" data-layer="detached"><span class="sw sw-faint"></span><span class="s">Detached</span><span class="l">Growth on hotspots &gt; 1 km from fire (predicted)</span></button></li>
      <li><button type="button" aria-pressed="false" data-layer="hotspots"><span class="sw sw-hot"></span><span class="s">Hotspots</span><span class="l">VIIRS hotspots, last 12 h</span></button></li>
      <li><button type="button" aria-pressed="false" data-layer="activity"><span class="sw sw-act"></span><span class="s">Likely tomorrow</span><span class="l">Fire likely tomorrow: watch area, 10 km squares (not a perimeter)</span></button></li>

    </ul>
  </section>
</details>
  <section id="timeline" class="tl-mini" aria-label="Fire timeline" hidden>
    <button type="button" id="tl-all" aria-pressed="true" title="Show every perimeter at once">All</button>
    <ol id="stops" class="stops"></ol>
    <button type="button" id="compare" aria-pressed="false" hidden title="Compare the forecast with perimeters observed later">Actual</button>
  </section>
  
  </div>
  <p id="announce" class="sr-only" aria-live="polite"></p>
</main>
</body>
</html>
