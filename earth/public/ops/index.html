<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ignopticon Ops: fires and spread forecasts</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#162c25">
<link rel="preload" href="vendor/maplibre-gl.js" as="script">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="ops.css">
<script type="module" src="ops.js"></script>
<script src="vendor/maplibre-gl.js" defer></script>
</head>
<body>
<div class="fresh"><span>IGNOPTICON / OPS</span><span id="fresh">Updated every 12 hours</span><div class="refresh-wrap"><div class="app-actions"><button type="button" id="install-app" hidden>Install app</button><button type="button" id="refresh-data">Refresh</button></div><span id="refresh-note" role="status" aria-live="polite"></span></div></div>
<div class="sidebar">
  <header class="brand">
    <h1>Wildfires</h1>
  </header>
  <section id="detail" class="detail" aria-labelledby="detail-name" hidden></section>
  <nav class="fires" aria-label="Fires">
    
    <div class="order">
      <span><label for="date">Select date</label>
      <select id="date"><option value="now">Today</option></select></span>
</div><p id="count" class="count"></p>
    <ul id="list" class="list"></ul>
  </nav>
<section class="conditions"><h3>Incident conditions</h3><dl><div><dt>Mapped fuel type</dt><dd id="fuel"></dd></div><div><dt>Wind at 10 m</dt><dd id="wind"></dd></div><div><dt>Weather</dt><dd id="weather"></dd></div></dl><p id="wx-source"></p></section>
<section class="fieldnotes"><h3>Incident access route</h3><p id="route-note"></p><button type="button" id="pick-access" aria-pressed="false">Choose access point on map</button><p id="access-note"></p><button type="button" id="fit-route" hidden>Show full route</button> <a id="road-directions" hidden target="_blank" rel="noopener noreferrer">Directions to route start ↗</a>
<label class="upload">Load dispatch route<input id="route-file" type="file" accept=".geojson,.json,application/geo+json,application/json"></label><p id="saved" role="status"></p><a href="storage.html">Offline maps</a></section><div id="status" class="status" role="status" aria-live="polite"></div><section id="timeline" class="timeline" aria-label="Fire timeline" hidden>
    <div class="time-key" aria-label="Fire progression colors"><span>Past</span><span>Current</span><span>Future</span></div><div class="tl-bar">
      <div role="group" aria-label="Timeline mode" class="seg">
        <button type="button" data-mode="progression" aria-pressed="true">Progression</button>
        <button type="button" data-mode="step" aria-pressed="false">Step</button>
      </div>
      <button type="button" id="play">Play</button>
      <button type="button" id="compare" aria-pressed="false" hidden>Compare with what happened <small>(later data)</small></button>
      <p class="tl-hint">Step: ← → keys</p>
    </div>
    <ol id="stops" class="stops"></ol>
  </section>
<details class="settings"><summary>Map settings</summary><div class="mapctl" role="group" aria-label="Map view">
    <div role="group" aria-label="Basemap" class="seg" id="basemaps">
      <button type="button" data-base="satellite">Satellite</button>
      <button type="button" data-base="imagerytopo">Satellite + topo</button>
      <button type="button" data-base="topo">Topo map</button>
    </div>
    <button type="button" id="view3d" aria-pressed="false" title="3D terrain (key 3)">3D</button>
    <button type="button" id="labels" aria-pressed="false">Labels</button>
  </div></details>
</div>
<main class="mapwrap" aria-label="Map">
  <div id="map" class="map"></div><div class="controls">
      <label for="filter" class="sr-only">Filter fires</label>
      <input id="filter" type="search" placeholder="Search fire name or location" autocomplete="off" spellcheck="false">
    </div><div class="mapnav"><button id="home">⌂ Home</button><button id="return">← Back</button></div><button id="locate" aria-label="Show my GPS position">◎ GPS</button><div id="viewtoggle" class="viewtoggle" role="group" aria-label="Map view"><button type="button" data-view="2d" aria-pressed="true">2D</button><button type="button" data-view="3d" aria-pressed="false" title="3D terrain (key 3)">3D</button></div>
  
  
  <div class="bottom">
  <section class="legend" id="legend" aria-labelledby="legend-h">
    <h2 id="legend-h" class="sr-only">Map layers</h2>
    <ul id="legend-list">
      <li><button type="button" aria-pressed="true" data-layer="current"><span class="sw sw-cur"></span><span class="s">Perimeter</span><span class="l">Current perimeter (FEDS)</span></button></li>
      <li><button type="button" aria-pressed="true" data-layer="previous"><span class="sw sw-prev"></span><span class="s">Past</span><span class="l">Past perimeters (brown to yellow)</span></button></li>
      <li><button type="button" aria-pressed="true" data-layer="forecast"><span class="sw-fc"><span class="sw sw-b0"></span><span class="sw sw-b1"></span><span class="sw sw-b2"></span></span><span class="s">Forecast</span><span class="l" id="fc-legend">Predicted front growth +6 / +12 / +24 h (hatched)</span></button></li>
      <li><button type="button" aria-pressed="true" data-layer="arrows"><span class="sw sw-arrow" aria-hidden="true">➜</span><span class="s">Advances</span><span class="l">Largest predicted advances</span></button></li>
      <li><button type="button" aria-pressed="false" data-layer="interior"><span class="sw sw-faint"></span><span class="s">Burnout</span><span class="l">Burnout inside perimeter (predicted)</span></button></li>
      <li><button type="button" aria-pressed="false" data-layer="detached"><span class="sw sw-faint"></span><span class="s">Detached</span><span class="l">Growth on hotspots &gt; 1 km from fire (predicted)</span></button></li>
      <li><button type="button" aria-pressed="false" data-layer="hotspots"><span class="sw sw-hot"></span><span class="s">Hotspots</span><span class="l">VIIRS hotspots, last 12 h</span></button></li>
    </ul>
    <button type="button" id="legend-toggle" class="lg-toggle" aria-expanded="false" aria-controls="legend-list">Key</button>
  </section>
  
  </div>
  <p id="announce" class="sr-only" aria-live="polite"></p>
</main>
</body>
</html>
