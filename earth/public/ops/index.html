<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ignopticon Ops: fires and spread forecasts</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#ffffff">
<link rel="preload" href="vendor/maplibre-gl.js" as="script">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="ops.css">
<script type="module" src="ops.js"></script>
<script src="vendor/maplibre-gl.js" defer></script>
</head>
<body>
<div class="sidebar">
  <header class="brand">
    <h1>Fires</h1>
    <span id="replay" class="tag"></span><span id="fresh" class="tag"></span>
  </header>
  <section id="detail" class="detail" aria-labelledby="detail-name" hidden></section>
  <div class="actions sel" role="group" aria-label="Fire actions">
    <a id="road-directions" class="chip primary" hidden target="_blank" rel="noopener noreferrer">Directions</a>
    <button type="button" id="pick-access" class="chip" aria-pressed="false">Access point</button>
    <label class="chip upload">Load route<input id="route-file" type="file" accept=".geojson,.json,application/geo+json,application/json"></label>
    <button type="button" id="fit-route" class="chip" hidden>Show route</button>
    <a class="chip" href="storage.html">Offline</a>
  </div>
  <p id="route-note" class="note sel"></p><p id="access-note" class="note sel"></p><p id="saved" class="note sel" role="status"></p>
  <section class="conditions sel" aria-label="Conditions at the fire">
    <dl><div><dt>Fuel</dt><dd id="fuel"></dd></div><div><dt>Wind</dt><dd id="wind"></dd></div><div><dt>Air</dt><dd id="weather"></dd></div></dl>
  </section>
  <section id="fcbox" class="fcbox sel" aria-label="Spread forecast"></section>
  <section id="timeline" class="timeline" aria-label="Fire timeline" hidden>
    <div class="tl-bar">
      <div role="group" aria-label="Timeline mode" class="seg">
        <button type="button" data-mode="progression" aria-pressed="true">All</button>
        <button type="button" data-mode="step" aria-pressed="false">Step</button>
      </div>
      <button type="button" id="play" class="round" aria-label="Play">▶</button>
      <button type="button" id="compare" class="chip" aria-pressed="false" hidden title="Compare with later observed perimeters">Actual</button>
    </div>
    <ol id="stops" class="stops"></ol>
  </section>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <details class="about sel"><summary>About this data</summary><ul id="about-list"></ul><p id="wx-source"></p></details>
  <nav class="fires" aria-label="Fires">
    <div class="listhead">
      <p id="count" class="count">Loading fires…</p>
      <label for="sort" class="sr-only">Sort fires</label>
      <select id="sort">
        <option value="distance">Nearest</option>
        <option value="growth">Growing</option>
        <option value="size">Largest</option>
        <option value="name">A–Z</option>
      </select>
    </div>
    <ul id="list" class="list"></ul>
  </nav>
</div>
<main class="mapwrap" aria-label="Map">
  <div id="map" class="map"></div>
  <div class="controls" role="search">
    <button type="button" id="return" class="icon" aria-label="Back to the fire list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <label for="filter" class="sr-only">Search fires</label>
    <input id="filter" type="search" placeholder="Search fires" autocomplete="off" spellcheck="false">
    <button type="button" id="home" class="icon" aria-label="Close and clear search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
  </div>
  <button type="button" id="locate" aria-label="Show my GPS position" title="My location"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.9 3A9 9 0 0 0 13 3.1V1h-2v2.1A9 9 0 0 0 3.1 11H1v2h2.1a9 9 0 0 0 7.9 7.9V23h2v-2.1a9 9 0 0 0 7.9-7.9H23v-2zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg></button>
  <div class="bottom">
    <section class="legend" id="legend" aria-labelledby="legend-h">
      <div class="lg-panel" id="legend-list">
        <h2 id="legend-h">Map type</h2>
        <div role="group" aria-label="Basemap" class="types" id="basemaps">
          <button type="button" data-base="satellite"><span class="thumb t-sat"></span>Satellite</button>
          <button type="button" data-base="imagerytopo"><span class="thumb t-hyb"></span>Hybrid</button>
          <button type="button" data-base="topo"><span class="thumb t-topo"></span>Terrain</button>
        </div>
        <div class="mapctl" role="group" aria-label="Map view">
          <button type="button" id="view3d" class="chip" aria-pressed="false" title="3D terrain (key 3)">3D</button>
          <button type="button" id="labels" class="chip" aria-pressed="false">Rivers &amp; names</button>
        </div>
        <h2>Layers</h2>
        <ul>
          <li><button type="button" aria-pressed="true" data-layer="current"><span class="sw sw-cur"></span>Perimeter now</button></li>
          <li><button type="button" aria-pressed="true" data-layer="previous"><span class="sw sw-prev"></span>Past perimeters</button></li>
          <li><button type="button" aria-pressed="true" data-layer="forecast"><span class="sw sw-fc"></span><span id="fc-legend">Forecast</span></button></li>
          <li><button type="button" aria-pressed="true" data-layer="arrows"><span class="sw sw-arrow" aria-hidden="true">➜</span>Advances</button></li>
          <li><button type="button" aria-pressed="false" data-layer="interior"><span class="sw sw-faint"></span>Burnout inside</button></li>
          <li><button type="button" aria-pressed="false" data-layer="detached"><span class="sw sw-faint"></span>Spot growth</button></li>
          <li><button type="button" aria-pressed="false" data-layer="hotspots"><span class="sw sw-hot"></span>Hotspots (12 h)</button></li>
        </ul>
        <h2>Weather &amp; satellite</h2>
        <div class="earthctl">
          <label for="wind-level">Wind</label>
          <select id="wind-level">
            <option value="off">Off</option>
            <option value="surface">Surface (10 m)</option>
            <option value="1000">1000 hPa · ~100 m</option>
            <option value="850">850 hPa · ~1.5 km</option>
            <option value="700">700 hPa · ~3 km</option>
            <option value="500">500 hPa · ~5.5 km</option>
            <option value="250">250 hPa · ~10 km</option>
            <option value="70">70 hPa · ~18 km</option>
            <option value="10">10 hPa · ~26 km</option>
          </select>
          <div role="group" aria-label="Particles show" class="seg" id="wind-flow">
            <button type="button" data-flow="wind" aria-pressed="true">Wind</button>
            <button type="button" data-flow="smoke" aria-pressed="false" title="Particles start at hotspots in view and drift on the wind. Not a dispersion model.">Smoke</button>
          </div>
        </div>
        <ul>
          <li><button type="button" aria-pressed="false" data-earth="hotspots"><span class="sw sw-frp"></span>All hotspots (VIIRS, by FRP)</button></li>
          <li><button type="button" aria-pressed="false" data-earth="heat"><span class="sw sw-heat"></span>Fire heat (FRP, day)</button></li>
        </ul>
        <div class="earthctl">
          <label for="overlay">Satellite overlay</label>
          <select id="overlay">
            <option value="none">None</option>
            <option value="fuel">Fuel (LANDFIRE)</option>
            <option value="heat-day">Heat, day (VIIRS I5)</option>
            <option value="heat-night">Heat, night (VIIRS I5)</option>
            <option value="band-day">Fire band, day (NOAA-21 I4)</option>
            <option value="band-night">Fire band, night (NOAA-21 I4)</option>
          </select>
        </div>
        <p id="earth-note" class="earth-note"></p>
      </div>
      <button type="button" id="legend-toggle" class="lg-toggle" aria-expanded="false" aria-controls="legend-list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 16.5-7.4-5.7L3 12.1l9 7 9-7-1.6-1.3zm0-2.5 7.4-5.7L21 7l-9-7-9 7 1.6 1.3z"/></svg>Layers</button>
    </section>
  </div>
  <p id="announce" class="sr-only" aria-live="polite"></p>
</main>
</body>
</html>
